insmod part_gpt
insmod part_msdos

function load_video {
  if [ x$feature_all_video_module = xy ]; then
    insmod all_video
  else
    insmod efi_gop
    insmod efi_uga
    insmod ieee1275_fb
    insmod vbe
    insmod vga
    insmod video_bochs
    insmod video_cirrus
  fi
}

set timeout=0
set timeout_style=hidden

arch=x86_64
insmod regexp
search -s root -u @IsoUUID
for iso in /archlinux-*-$arch.iso ; do
  if [ ! -f "$iso" ] ; then
    continue
  fi
  regexp -s build 'archlinux-(.+)-'$arch "$iso"
  menuentry "Arch Linux $build $arch" --source="\
    loopback loop $iso
    probe -s isolabel -l loop
    linux (loop)/arch/boot/$arch/vmlinuz-linux archisolabel=\$isolabel img_dev=UUID=@IsoUUID img_loop=$iso earlymodules=loop
    initrd (loop)/arch/boot/$arch/initramfs-linux.img"
  done
}

if [ "$grub_platform" = "efi" ]; then
  fwsetup --is-supported
  if [ "$?" = 0 ]; then
    menuentry 'UEFI Firmware' $menuentry_id_option 'uefi-firmware' {
      fwsetup
    }
  fi
fi

if search --no-floppy --fs-uuid @RootUUID; then
  menuentry 'Memtest' --class arch --class gnu-linux --class gnu --class os $menuentry_id_option 'gnulinux-simple-/dev/mapper/lvm-root' {
    load_video
    set gfxpayload=keep
    insmod gzio
    insmod part_gpt
    insmod cryptodisk
    insmod luks
    insmod gcry_rijndael
    insmod gcry_sha512
    insmod ext2
    cryptomount -u @BootUUID
    set root='cryptouuid/@bootUuid'
    search --fs-uuid --set=root --hint='cryptouuid/@bootUuid' @CryptBootUUID
    echo 'Loading Linux linux ...'
    linux /vmlinuz-linux root=/dev/mapper/lvm-root rw loglevel=3 quiet
    echo 'Loading initial ramdisk ...'
    initrd /intel-ucode.img /initramfs-linux.img
  }
fi